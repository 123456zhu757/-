name: Deploy website to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Clear timed-out Pages deployment
        uses: actions/github-script@v7
        with:
          script: |
            const deploymentId = '38b7727da7f07f8d764c7b176085148b48e41c50';
            const params = { ...context.repo, pages_deployment_id: deploymentId };
            let response;
            try {
              response = await github.request('GET /repos/{owner}/{repo}/pages/deployments/{pages_deployment_id}', params);
            } catch (error) {
              if (error.status === 404) { core.info('Old deployment no longer exists.'); return; }
              throw error;
            }
            const pending = new Set(['deployment_in_progress', 'queued', 'cancel_pending']);
            if (!pending.has(response.data.status)) {
              core.info('Old deployment is terminal: ' + response.data.status);
              return;
            }
            if (response.data.status !== 'cancel_pending') {
              await github.request('POST /repos/{owner}/{repo}/pages/deployments/{pages_deployment_id}/cancel', params);
            }
            for (let attempt = 0; attempt < 18; attempt++) {
              await new Promise(resolve => setTimeout(resolve, 5000));
              const result = await github.request('GET /repos/{owner}/{repo}/pages/deployments/{pages_deployment_id}', params);
              core.info('Old deployment: ' + result.data.status);
              if (!pending.has(result.data.status)) return;
            }
            core.setFailed('Old Pages deployment has not finished cancelling.');
      - id: deployment
        uses: actions/deploy-pages@v4
